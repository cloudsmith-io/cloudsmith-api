repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.10
  hooks:
    - id: ruff
      args: [ --fix ]
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.30.1
  hooks:
    - id: zizmor
- repo: https://github.com/jdx/jactionlint
  rev: v2.1.0
  hooks:
    - id: jactionlint
