repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.1
  hooks:
    - id: ruff
      args: [ --fix ]
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.31.1
  hooks:
    - id: zizmor
- repo: https://github.com/jdx/jactionlint
  rev: v2.3.0
  hooks:
    - id: jactionlint
